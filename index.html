<!DOCTYPE html>
<html>
<head>
  <title>App Simple</title>
</head>
<body>

<h2>Login Sederhana</h2>

<input id="username" placeholder="Username"><br><br>
<button onclick="login()">Login</button>

<h3 id="saldo">Saldo: -</h3>

<br>
<button onclick="deposit()">Deposit 10.000</button>
<button onclick="withdraw()">Withdraw 10.000</button>

<script>
let user = "";

function getSaldo() {
  return parseInt(localStorage.getItem(user));
}

function setSaldo(value) {
  localStorage.setItem(user, value);
}

function modifySaldo(amount) {
  let saldo = getSaldo();
  if (saldo + amount < 0) return alert("Saldo kurang!");
  setSaldo(saldo + amount);
  updateSaldo();
}

function login() {
  user = document.getElementById("username").value;

  if (!localStorage.getItem(user)) {
    setSaldo(100000);
  }

  updateSaldo();
}

function updateSaldo() {
  document.getElementById("saldo").innerText = "Saldo: Rp " + getSaldo();
}

function deposit() {
  modifySaldo(10000);
}

function withdraw() {
  modifySaldo(-10000);
}
</script>

</body>
</html>
